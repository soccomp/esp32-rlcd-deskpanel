; ESP32-CAM (AI-Thinker C7-3-4L) —— RLCD 配套摄像头固件
; 职责：多 WiFi 自动切换 + mDNS(esp32cam) + 单帧/流 HTTP 服务
;
; 烧录：USB-TTL 接板子 (IO0-GND 短接进下载模式)，upload_port 改成你的串口
;   例如 macOS: /dev/cu.usbserial-XXXX 或 /dev/cu.wchusbserialXXXX
;   烧完：去掉 IO0 接地线，按板上 RESET 复位
;
; 注意：ESP32-CAM 没有原生 USB，不要加 ARDUINO_USB_CDC 相关宏（那是 S3 的）

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; ESP32-CAM: 4MB Flash + 4MB PSRAM，PSRAM 必须启用（esp32-camera 需要）
board_build.flash_size = 4MB
board_build.psram = enabled
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_AI_THINKER
    -DCORE_DEBUG_LEVEL=1

; 烧录：底座无 IO0 自动控制（DTR 未接 IO0），esptool default_reset 时序不匹配。
; 正确姿势：按住底座 IO0 键 + 拔插 USB 进下载模式，保持按住（超时复位后自动再进），
; esptool 用 no_reset 直连（不复位，不干扰下载模式）。
upload_flags =
    --before
    no_reset

; 摄像头驱动：用 framework 内置的老版 esp32-camera（AI-Thinker 官方例程同款，classic ESP32 验证过）
; ⚠️ espressif/esp32-camera@2.0.4（新版）在 classic ESP32 上无帧输出（frames=0 + EV-EOF-OVF），勿启用
; lib_deps =
;     espressif/esp32-camera

; 串口位置按你的 USB-TTL 改（USB 重插后端口名会变，用 ls /dev/cu.usb* 确认）
upload_port = /dev/cu.usbserial-1120
monitor_port = /dev/cu.usbserial-1120
