; RLCD Desk Panel — ESP32-S3 RLCD 4.2" / LVGL v8
; 复用了 rlcd-minimal 验证过的配置：PSRAM=enabled(四线QSPI) + USB-CDC 串口
[platformio]
safe_deletes = no            ; 非交互环境：允许全量清理（否则 SAFE_DELETE 阻塞编译）

[env:esp32-s3-rlcd]
platform = espressif32
board = esp32-s3-rlcd              ; 自定义板：继承 devkitc-1，但强制 build.arduino.memory_type=qio_opi
                                   ; （N16R8 为 8MB 八线/Octal PSRAM，否则 boot 报 PSRAM ID read error）
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.f_flash = 80000000
board_build.flash_mode = qio
board_build.psram = enabled          ; 启用 PSRAM（BOARD_HAS_PSRAM）
board_build.variant = esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1             ; Serial 走原生 USB-CDC（本板无外部串口桥）
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=24576  ; 8-12：main loop 跑天气/会议/行情刷新（HTTP+JSON+UI），
                                     ; 默认 8KB 栈密集切页时溢出 -> PANIC(reset reason 4)，提到 24KB
    -DLV_CONF_PATH="${PROJECT_DIR}/src/lv_conf.h"
    ; 8-20 切回 USB 全链路视频（AP 对 ESP32-CAM WiFi 周期楔死，6 版未根治）：
    ; 恢复 CAM_USB_INPUT -> RLCD 从 USB-CDC 经 bridge 拉摄像头串口帧，绕开 WiFi 数据面。
    -DCAM_USB_INPUT
    ; USB-CDC 接收：Arduino 层 rx_queue 默认 256B 会溢出丢帧，已在 cam_client_init 里 setRxBufferSize(32KB)
    ; ── 修复 ESP32 经 4G 蜂窝隧道(MTU=1250)时 TCP 被 RST ──
    ; framework 自带预编译 sdkconfig.h 里 CONFIG_LWIP_TCP_MSS=1436，超过隧道 MTU，
    ; 远端回传的大段被丢弃→连接 reset；电脑有 PMTUD 能自动降 MSS 故正常，UDP 段小故正常。
    ; 用命令行 -D 强制覆盖（优先级高于头文件 #define），降到 1200 留余量。
    -DCONFIG_LWIP_TCP_MSS=1200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
; ── WiFi OTA（免线烧录，固件已内置 ArduinoOTA，端口 3232）──
; 方法一（PlatformIO 原生，需另建 env 改 upload_protocol=espota）
; 方法二（直接命令行，最快，无需改配置）：
;   python ~/.platformio/packages/framework-arduinoespressif32/tools/espota.py \
;     -i <设备IP> -p 3232 -f .pio/build/esp32-s3-rlcd/firmware.bin
;   例：python ~/.platformio/packages/framework-arduinoespressif32/tools/espota.py \
;       -i 192.168.2.91 -p 3232 -f .pio/build/esp32-s3-rlcd/firmware.bin
; 设备 IP 可从串口日志 "WiFi connected, IP=..." 看到；烧录变砖时仍可插线用 esptool 恢复
lib_deps =
    arduinojson@6                    ; 股票行情 JSON 解析（钉死 v6，避免 v7 API 差异）
    bodmer/TJpg_Decoder@1.1.0        ; 摄像头 JPEG 解码（cam_client.cpp）
    lvgl/lvgl@8.4.0                  ; LVGL v8（registry 版本，可复现；本地定制见 patch_lvgl.py）
; 可复现性（2026-08-20）：原 lib/lvgl 符号链接指向本机绝对路径，clean checkout 不可用。
; 改 registry lvgl@8.4.0 + extra_scripts 钩子（scripts/patch_lvgl.py）自动重新应用唯一本地
; 定制（lv_refr.c 偶数 flush 块高，ST7305 旋转路径必需）。勿加 pre:/post: 前缀——那样脚本在
; libdeps 下载前执行，找不到 lv_refr.c。
extra_scripts =
    scripts/patch_lvgl.py

