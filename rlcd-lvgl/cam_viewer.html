<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-CAM 实时监控</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #1f2329; min-height: 100vh;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    position: sticky; top: 0; z-index: 10;
  }
  .title { font-size: 18px; font-weight: 600; }
  .title .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #f5222d; margin-right: 8px; vertical-align: 2px;
    animation: blink 1.2s infinite;
  }
  .title .dot.on { background: #52c41a; animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .status { font-size: 13px; color: #666; }
  .status b { color: #1f2329; }
  .main { display: flex; justify-content: center; align-items: center; padding: 20px; }
  .stage {
    background: #000; border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.2); position: relative;
    max-width: 960px; width: 100%;
  }
  .stage img {
    display: block; width: 100%; height: auto;
    image-rendering: auto;
  }
  .overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    color: #fff; font-size: 12px; padding: 24px 12px 8px;
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    text-align: center; color: #999; font-size: 12px; padding: 0 24px 20px;
  }
  .hint code {
    background: #e8eaf0; padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title"><span class="dot" id="dot"></span>ESP32-CAM 实时监控</div>
    <div class="status">
      分辨率 <b>640×480</b> · 帧率 <b id="fps">--</b> · 后端 <b id="seq">--</b>
    </div>
  </div>
  <div class="main">
    <div class="stage">
      <img id="cam" src="http://192.168.100.198:8100/api/camstream" alt="摄像头实时画面">
      <div class="overlay">
        <span>ESP32-CAM · 192.168.100.199</span>
        <span id="clock">--:--:--</span>
      </div>
    </div>
  </div>
  <div class="hint">
    画面来自 <code>http://192.168.100.198:8100/api/camstream</code>（Mac 后端 MJPEG 代理）
    · 若画面停止，请检查摄像头供电与后端服务
  </div>

<script>
  const img = document.getElementById('cam');
  const dot = document.getElementById('dot');
  const fpsEl = document.getElementById('fps');
  const seqEl = document.getElementById('seq');
  const clockEl = document.getElementById('clock');

  let lastFrame = 0;
  let frames = 0;
  let lastSeq = 0;

  // 帧到达统计（浏览器每帧触发 load 事件）
  img.addEventListener('load', () => {
    frames++;
    const now = performance.now();
    if (now - lastFrame >= 2000) {
      fpsEl.textContent = (frames / ((now - lastFrame) / 1000)).toFixed(1) + ' fps';
      frames = 0;
      lastFrame = now;
    }
    dot.classList.add('on');
  });

  // 每 2 秒刷新时钟
  setInterval(() => {
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString('zh-CN', { hour12: false });
  }, 1000);

  // 掉线检测：5 秒无新帧 -> 红点闪烁
  setInterval(() => {
    const now = performance.now();
    if (now - lastFrame > 5000) dot.classList.remove('on');
  }, 1000);
</script>
</body>
</html>
